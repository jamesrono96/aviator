<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aviator Classroom Simulation</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">✈</span><span>AVIATOR</span></div>
  <div class="demo">DEMO</div>
</header>

<main>
  <section class="wallet card">
    <div><span class="muted">Balance</span><strong id="balance">10,000.00</strong> <span class="currency">VIRTUAL</span></div>
    <div class="wallet-actions">
      <button id="deposit">Deposit</button><button id="withdraw">Withdraw</button>
    </div>
  </section>

  <section class="game card">
    <div class="game-head"><span id="status">WAITING</span><span id="roundLabel">ROUND IN PROGRESS</span></div>
    <div class="sky">
      <div id="stars"></div>
      <div class="multiplier" id="multiplier">1.00x</div>
      <div class="trajectory" id="trajectory"></div>
      <div class="plane" id="plane">✈</div>
      <div class="crash" id="crash">CRASHED</div>
    </div>
    <div class="controls">
      <button class="primary" id="bet">PLACE BET</button>
      <button class="cashout" id="cashout" disabled>CASH OUT</button>
    </div>
    <div class="betbox">
      <label>Bet amount <input id="stake" type="number" min="1" step="1" value="100"></label>
      <span class="muted">Virtual balance only</span>
    </div>
  </section>

  <section class="card history">
    <div class="history-head"><h2>Recent rounds</h2><span class="muted">Live session</span></div>
    <div id="historyRows"></div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="modalTitle">Wallet</h2>
    <p id="modalText">Virtual money is used for classroom demonstration.</p>
    <button id="closeModal">Close</button>
  </div>
</div>

<footer>Classroom simulation • Virtual credits • No real-money transactions</footer>
<script src="script.js"></script>
</body>
</html>

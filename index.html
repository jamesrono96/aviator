<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Aviator Research Classroom</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="auth" class="auth"><div class="authCard"><div class="brand">✈ AVIATOR</div><p class="sub">Fast. Simple. Classroom simulation.</p>
<div class="tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Create account</button></div>
<div id="authForm"></div><p class="fine">Research demonstration account. No real-money transactions.</p></div></div>
<div id="app" class="hidden">
<header><div class="brand">✈ AVIATOR</div><div class="user" id="userPhone"></div></header>
<main>
<section class="wallet"><div><small>Balance</small><strong id="bal">10,000.00</strong><span>Credits</span></div><div class="walletBtns"><button id="dep">Deposit</button><button id="wit">Withdraw</button></div></section>
<section class="game"><div class="gameTop"><span id="state">NEXT ROUND</span><span id="clock">READY</span></div><div class="sky"><div class="stars"></div><div id="mult">1.00x</div><div id="trail"></div><div id="plane">✈</div><div id="crash">CRASHED</div></div></section>
<section class="bets panel"><div class="head"><h2>Bet entries</h2><button id="add">+ Add entry</button></div><div id="entries"></div><button class="place" id="place">PLACE BETS</button><div class="note">Up to 5 entries. Entries added while flying are queued for the next round.</div></section>
<section class="panel"><div class="head"><h2>Recent results</h2><span class="live">LIVE</span></div><div id="history"></div></section>
</main></div>
<div id="modal" class="modal"><div class="modalCard"><h2 id="mt"></h2><p id="mx"></p><input id="amt" type="number" min="1" placeholder="Amount"><button id="ok">Confirm</button><button id="close" class="dark">Cancel</button></div></div>
<script src="script.js"></script></body></html>

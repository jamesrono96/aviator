<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aviator Research Classroom</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
 <div class="brand"><span>✈</span> AVIATOR</div><div class="account" id="accountLabel">Guest</div>
</header>
<main>
<section class="auth card">
 <div class="authrow">
  <div><span class="muted">Account</span><strong id="phoneLabel">Not signed in</strong></div>
  <button id="signupBtn">Create account</button>
  <button id="signinBtn">Sign in</button>
 </div>
</section>

<section class="wallet card">
 <div><span class="muted">Balance</span><strong id="balance">10,000.00</strong></div>
 <div class="wallet-actions"><button id="deposit">Deposit</button><button id="withdraw">Withdraw</button></div>
</section>

<section class="game card">
 <div class="gamehead"><span id="status">WAITING</span><span>LIVE</span></div>
 <div class="sky">
  <div class="stars"></div>
  <div class="multiplier" id="multiplier">1.00x</div>
  <div class="trail" id="trail"></div>
  <div class="plane" id="plane">✈</div>
  <div class="crash" id="crash">CRASHED</div>
 </div>
</section>

<section class="bets card">
 <div class="betshead"><h2>Bet entries</h2><button id="addBet">+ Add entry</button></div>
 <div id="betRows"></div>
 <button class="place" id="placeAll">PLACE BETS</button>
</section>

<section class="card history"><h2>Recent rounds</h2><div id="history"></div></section>
</main>

<div class="modal" id="modal"><div class="modalcard">
 <h2 id="modalTitle">Account</h2><p id="modalText"></p><div id="modalBody"></div>
 <button id="modalAction">Continue</button><button class="secondary" id="closeModal">Close</button>
</div></div>
<footer>Research classroom simulation • No real-money transactions</footer>
<script src="script.js"></script>
</body></html>
